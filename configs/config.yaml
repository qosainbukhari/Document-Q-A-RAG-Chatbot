# Every advanced technique can be switched on/off here, so naive and
# advanced RAG can be compared (see configs/eval/ and evaluation/).

# Naive chunking, used when chunking.strategy is "naive"
chunk_size: 1000
chunk_overlap: 200

chunking:
  # naive        -> 1000-char chunks are both searched and sent to the LLM
  # parent_child -> search 300-char children, send their 1500-char parents
  strategy: parent_child
  parent_chunk_size: 1500
  parent_chunk_overlap: 200
  child_chunk_size: 300
  child_chunk_overlap: 50

retriever:
  top_k: 4          # chunks sent to the LLM
  candidates: 20    # chunks fetched from search before narrowing to top_k

  hybrid:
    enabled: true   # dense (embeddings) + sparse (BM25 keywords), fused with RRF
    rrf_k: 60       # RRF constant: score = sum 1 / (rrf_k + rank)

memory:
  window_size: 5
  max_sessions: 1000
